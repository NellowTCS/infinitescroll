<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InfiniteScroll</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="module" crossorigin src="./assets/index-xO3HFUFF.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-B2LBShfc.css">
<link rel="manifest" href="./manifest.webmanifest"><script id="vite-plugin-pwa:register-sw" src="./registerSW.js"></script>
<meta name="theme-color" content="#f8b4c8">
<link rel="icon" href="./favicon.ico" sizes="48x48">
<link rel="apple-touch-icon" href="./apple-touch-icon-180x180.png"></head>
<body>
    <!-- Floating depth orbs -->
    <div class="orbs" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="orb orb-4"></div>
        <div class="orb orb-5"></div>
        <div class="orb orb-6"></div>
    </div>

    <!-- Vignette overlay for depth -->
    <div class="vignette" aria-hidden="true"></div>

    <!-- Noise texture overlay -->
    <div class="noise-overlay" aria-hidden="true"></div>

    <!-- Top-right control buttons -->
    <div class="controls" id="controls">
        <button class="ctrl-btn toggle-btn" id="toggleBtn" aria-label="Pause animation" title="Pause / Play (Space)">
            <i class="fas fa-pause"></i>
        </button>
        <button class="ctrl-btn settings-btn" id="settingsBtn" aria-label="Open settings" title="Settings (S)">
            <i class="fas fa-sliders-h"></i>
        </button>
        <button class="ctrl-btn fullscreen-btn" id="fullscreenBtn" aria-label="Toggle fullscreen" title="Fullscreen (F)">
            <i class="fas fa-expand"></i>
        </button>
    </div>

    <!-- Settings panel -->
    <div class="settings-panel" id="settingsPanel" role="dialog" aria-label="Settings" aria-hidden="true">
        <div class="settings-header">
            <h2>Settings</h2>
            <button class="close-btn" id="closeSettingsBtn" aria-label="Close settings">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="settings-body">
            <div class="setting-group">
                <div class="setting-label">
                    <label for="speedSlider"><i class="fas fa-tachometer-alt"></i> Speed</label>
                    <span id="speedValue" class="setting-value">1.0x</span>
                </div>
                <input type="range" id="speedSlider" min="0.25" max="4" step="0.25" value="1">
            </div>

            <div class="setting-group">
                <div class="setting-label">
                    <label for="directionSlider"><i class="fas fa-compass"></i> Angle</label>
                    <span id="directionValue" class="setting-value">135&deg;</span>
                </div>
                <input type="range" id="directionSlider" min="0" max="360" step="1" value="135">
            </div>

            <div class="setting-group">
                <div class="setting-label">
                    <label for="intensitySlider"><i class="fas fa-sun"></i> Saturation</label>
                    <span id="intensityValue" class="setting-value">100%</span>
                </div>
                <input type="range" id="intensitySlider" min="20" max="150" step="5" value="100">
            </div>

            <div class="setting-group">
                <div class="setting-label">
                    <label><i class="fas fa-palette"></i> Theme</label>
                </div>
                <div class="theme-buttons" id="themeButtons">
                    <button class="theme-btn active" data-theme="pastel" aria-label="Pastel theme">
                        <span class="theme-preview" style="background: linear-gradient(135deg, hsl(340,75%,82%), hsl(180,58%,80%), hsl(255,58%,82%))"></span>
                        <span class="theme-name">Pastel</span>
                    </button>
                    <button class="theme-btn" data-theme="neon" aria-label="Neon theme">
                        <span class="theme-preview" style="background: linear-gradient(135deg, #ff006e, #00f5d4, #3a86ff)"></span>
                        <span class="theme-name">Neon</span>
                    </button>
                    <button class="theme-btn" data-theme="ocean" aria-label="Ocean theme">
                        <span class="theme-preview" style="background: linear-gradient(135deg, #023e8a, #0096c7, #90e0ef)"></span>
                        <span class="theme-name">Ocean</span>
                    </button>
                    <button class="theme-btn" data-theme="sunset" aria-label="Sunset theme">
                        <span class="theme-preview" style="background: linear-gradient(135deg, #ff6b35, #e63946, #7b2d8e)"></span>
                        <span class="theme-name">Sunset</span>
                    </button>
                    <button class="theme-btn" data-theme="forest" aria-label="Forest theme">
                        <span class="theme-preview" style="background: linear-gradient(135deg, #2d6a4f, #95d5b2, #d4a373)"></span>
                        <span class="theme-name">Forest</span>
                    </button>
                    <button class="theme-btn" data-theme="cosmic" aria-label="Cosmic theme">
                        <span class="theme-preview" style="background: linear-gradient(135deg, #7400b8, #5390d9, #80ffdb)"></span>
                        <span class="theme-name">Cosmic</span>
                    </button>
                </div>
            </div>

            <div class="setting-group">
                <div class="setting-label">
                    <label for="mouseToggle"><i class="fas fa-mouse-pointer"></i> Mouse Reactive</label>
                    <label class="switch">
                        <input type="checkbox" id="mouseToggle" checked>
                        <span class="switch-slider"></span>
                    </label>
                </div>
            </div>

            <div class="setting-group">
                <div class="setting-label">
                    <label for="orbsToggle"><i class="fas fa-circle"></i> Floating Orbs</label>
                    <label class="switch">
                        <input type="checkbox" id="orbsToggle" checked>
                        <span class="switch-slider"></span>
                    </label>
                </div>
            </div>
        </div>

        <div class="settings-footer">
            <button class="reset-btn" id="resetBtn">
                <i class="fas fa-undo"></i> Reset Defaults
            </button>
        </div>
    </div>

    <!-- Settings panel backdrop -->
    <div class="settings-backdrop" id="settingsBackdrop"></div>

    <!-- Keyboard shortcuts hint -->
    <div class="keyboard-hints" id="keyboardHints">
        <span><kbd>Space</kbd> Pause</span>
        <span><kbd>F</kbd> Fullscreen</span>
        <span><kbd>S</kbd> Settings</span>
        <span><kbd>+</kbd><kbd>-</kbd> Speed</span>
    </div>

    <!-- Infinite scroll content -->
    <div class="content" id="content"></div>

</body>
</html>
